name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -s typecheck
      - run: pnpm -s test

  graph:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: graph
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: graph/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm -s typecheck
      - run: pnpm -s test
